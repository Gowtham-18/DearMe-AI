services:
  - type: web
    name: dearme-nlp
    runtime: python
    rootDir: services/nlp
    plan: free
    # No torch: models run on ONNX Runtime (~360 MB idle) and are downloaded at build time.
    buildCommand: >-
      pip install --upgrade pip &&
      pip install --only-binary=:all: -r requirements.txt &&
      python -m app.fetch_models
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NLP_INTERNAL_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SENTIMENT_SOURCE
        value: emotion
      - key: NLP_LOW_MEMORY
        value: "false"
      - key: NLP_THREADS
        value: "1"
      # glibc otherwise grows a malloc arena per worker thread, inflating RSS on small instances.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: ENABLE_ENHANCED_LANGUAGE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
