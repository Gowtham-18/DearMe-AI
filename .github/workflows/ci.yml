name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dearme/web exec tsc --noEmit
      - run: pnpm --filter @dearme/web test
      - run: pnpm --filter @dearme/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  nlp:
    name: NLP service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nlp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/nlp/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: services/nlp/.models
          key: onnx-models-${{ hashFiles('services/nlp/app/pipeline.py') }}
          restore-keys: onnx-models-
      - run: "pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt"
      - run: python -m app.fetch_models
      - run: pytest -q

  migrations:
    name: Database migrations + RLS (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix /tmp/pg @electric-sql/pglite@0.2.17
      - run: node scripts/test-migrations.mjs . /tmp/pg
