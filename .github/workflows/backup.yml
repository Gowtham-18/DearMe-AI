name: Nightly encrypted backup

# Dumps the database every night, encrypts it with an age public key, and keeps it for 14 days.
# Does nothing until both secrets are set. See docs/backup-plan.md for setup and restore.
on:
  schedule:
    - cron: "30 20 * * *" # 02:00 India time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DB_URL" ] || [ -z "$AGE_RECIPIENT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backups aren't set up yet: add SUPABASE_DB_URL and BACKUP_AGE_RECIPIENT (see docs/backup-plan.md)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pg_dump 17 and age
        if: steps.cfg.outputs.configured == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump, encrypt and check
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out
          stamp="$(date -u +%Y-%m-%dT%H%MZ)"
          # Plain text never touches disk: pg_dump streams straight into age.
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            | age --encrypt --recipient "$AGE_RECIPIENT" --output "out/dearme-$stamp.dump.age"
          size="$(stat -c %s "out/dearme-$stamp.dump.age")"
          if [ "$size" -lt 2048 ]; then
            echo "::error::Backup is suspiciously small ($size bytes)."
            exit 1
          fi
          echo "Encrypted backup: dearme-$stamp.dump.age ($size bytes)"

      - name: Keep for 14 days
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dearme-backup
          path: out/*.dump.age
          retention-days: 14
          if-no-files-found: error
