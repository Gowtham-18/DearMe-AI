name: Keep alive (free tier)

# Free-tier housekeeping during the pilot. Costs nothing: Actions minutes are free on public repos,
# and pinging only during waking hours (~540 of Render's 750 free instance hours a month) leaves headroom.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.
on:
  schedule:
    # Every 10 min, 01:00-18:59 UTC (06:30-00:29 IST): Render's free NLP service sleeps after 15 idle
    # minutes and then takes ~50 s to wake, so replies stay fast while people are likely to journal.
    - cron: "*/10 1-18 * * *"
    # Daily: one database round trip so the free Supabase project isn't paused after 7 idle days.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake the NLP service
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://dearme-nlp.onrender.com/health
      - name: Touch the database
        if: github.event.schedule == '17 6 * * *' || github.event_name == 'workflow_dispatch'
        run: curl -fsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 30 https://dear-me-ai-webapp.vercel.app/api/health
